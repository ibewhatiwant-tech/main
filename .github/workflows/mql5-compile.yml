name: Compile MQL5

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/mql5-compile.yml'
  push:
    branches: [main]
    paths:
      - '**/*.mq5'
      - '**/*.mqh'

permissions:
  contents: read

jobs:
  compile:
    name: MQL5 Compile Check
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MetaTrader 5 terminal (provides MetaEditor compiler)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait

          $searchRoots = @(
            $env:ProgramFiles,
            ${env:ProgramFiles(x86)},
            (Join-Path $env:APPDATA 'MetaQuotes'),
            (Join-Path $env:LOCALAPPDATA 'Programs')
          ) | Where-Object { $_ -and (Test-Path $_) }

          $metaeditor = Get-ChildItem -Path $searchRoots -Recurse -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaeditor) {
            throw 'metaeditor64.exe not found after MetaTrader 5 installation.'
          }
          # mql-compile-action globs mt-path with the npm 'glob' package, which requires
          # forward slashes for '**' patterns; path.join's backslashes make it match nothing.
          $mt5Path = $metaeditor.DirectoryName -replace '\\', '/'
          echo "MT5_PATH=$mt5Path" >> $env:GITHUB_ENV

      - name: Compile MQL5 sources
        uses: fx31337/mql-compile-action@v2.0.0
        with:
          # Change this to your actual EA file or folder.
          path: 'EAs'

          # Required so #include files in the repo can be found.
          include: '.'

          # Compile output retained as an artifact for diagnosis.
          log-file: 'mql5-compile.log'

          # Treat warnings as failures initially for stricter quality control.
          ignore-warnings: false

          # Points at the MetaEditor install located in the previous step.
          mt-path: ${{ env.MT5_PATH }}

          # Needed if your EA uses standard MT5 includes,
          # e.g. #include <Trade/Trade.mqh>.
          init-platform: true

          verbose: true

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql5-compile-log
          path: mql5-compile.log
          if-no-files-found: warn
          retention-days: 14
