name: Compile MQL5

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.mq5'
      - '**/*.mqh'
      - '.github/workflows/mql5-compile.yml'
  push:
    branches: [main]
    paths:
      - '**/*.mq5'
      - '**/*.mqh'

permissions:
  contents: read

jobs:
  compile:
    name: MQL5 Compile Check
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MetaTrader 5 terminal (provides MetaEditor compiler)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait

          $searchRoots = @(
            $env:ProgramFiles,
            ${env:ProgramFiles(x86)},
            (Join-Path $env:APPDATA 'MetaQuotes'),
            (Join-Path $env:LOCALAPPDATA 'Programs')
          ) | Where-Object { $_ -and (Test-Path $_) }

          $metaeditor = Get-ChildItem -Path $searchRoots -Recurse -Filter 'metaeditor64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $metaeditor) {
            throw 'metaeditor64.exe not found after MetaTrader 5 installation.'
          }
          echo "METAEDITOR=$($metaeditor.FullName)" >> $env:GITHUB_ENV

      - name: Compile MQL5 sources
        shell: pwsh
        run: |
          # MetaEditor's own process exit code is not a reliable success signal (it can
          # return 0 on failed compiles); the compiler only ever writes a .ex5 when the
          # file is truly free of errors, so that is the pass/fail check used below.
          $logDir = Join-Path $env:GITHUB_WORKSPACE 'compile-logs'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null

          $sources = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'EAs') -Filter '*.mq5' -Recurse
          if ($sources.Count -eq 0) {
            throw 'No .mq5 files found under EAs/.'
          }

          $failed = $false
          foreach ($source in $sources) {
            $ex5 = [System.IO.Path]::ChangeExtension($source.FullName, 'ex5')
            if (Test-Path $ex5) { Remove-Item $ex5 }

            $logFile = Join-Path $logDir "$($source.BaseName).log"
            Write-Host "::group::Compiling $($source.Name)"
            & "$env:METAEDITOR" "/compile:$($source.FullName)" "/inc:$env:GITHUB_WORKSPACE" "/log:$logFile"

            if (Test-Path $logFile) {
              Get-Content -Path $logFile -Encoding Unicode | Write-Host
            } else {
              Write-Host "(no log file produced)"
            }
            Write-Host "::endgroup::"

            if (-not (Test-Path $ex5)) {
              Write-Host "::error::Compilation failed for $($source.Name) - no .ex5 output produced."
              $failed = $true
            }
          }

          if ($failed) {
            throw 'One or more MQL5 files failed to compile. See the logs above and the uploaded artifact.'
          }

      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql5-compile-log
          path: compile-logs/*.log
          if-no-files-found: warn
          retention-days: 14
